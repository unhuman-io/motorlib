name: build

on:
  push:

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container: leemagnusson/arm-gcc:latest
    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive
    - name: make otp test
      run: |
        cd peripheral/stm32g4/otp
        make NAME=motor_molex REV=MR0 NUM=25 GCC_PATH=/gcc/bin
        # also check for failing cases
        ! make GCC_PATH=/gcc/bin
        ! make NAME=fail REV=MR0 NUM=25 GCC_PATH=/gcc/bin
        ! make REV=MR0 GCC_PATH=/gcc/bin
    - name: make test
      run: |
        cd test
        make test_error_mask
        ./test_error_mask
        make test_logger
        ./test_logger
        make test_crc5
        ./test_crc5

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - name: clang-format
      # The version that .clang-format is written for; .clang-format-ignore
      # names what is not ours to format. To format: the same with -i in place
      # of --dry-run --Werror.
      run: pipx run clang-format==23.1.5 --dry-run --Werror $(git ls-files '*.h' '*.hpp' '*.c' '*.cc' '*.cpp' '*.cppm')
